# Blueprint Render per il backend. Il frontend è su Cloudflare Pages e il
# database su Neon: qui c'è solo il web service Node.
#
# Build ed esecuzione partono dalla ROOT del monorepo: `server` e `web`
# dipendono dal package di workspace @fanta-helper/shared, non pubblicato su
# npm, che si risolve solo dalla root. A runtime tsup inlina shared nel bundle,
# quindi server/dist/index.js è autosufficiente.
services:
  - type: web
    name: fanta-helper-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci && npm run build --workspace server
    startCommand: node server/dist/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Render inietta PORT automaticamente; il server la legge da process.env.PORT.
      - key: NODE_VERSION
        value: 20.11.0
      # Connection string POOLED di Neon (host con -pooler): impostare nel dashboard.
      - key: DATABASE_URL
        sync: false
      # URL del sito Cloudflare Pages, da compilare dopo il deploy del frontend.
      - key: CORS_ORIGIN
        sync: false
      # Segreto di firma dei cookie di sessione (stateless, nessuna tabella
      # sessioni): impostare nel dashboard.
      - key: COOKIE_SECRET
        sync: false
      - key: COOKIE_SECURE
        value: true
      # Probabili formazioni: estrazione da screenshot via Claude (vision).
      # Chiave da generare su console.anthropic.com, da impostare nel dashboard.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: ANTHROPIC_BASE_URL
        value: https://api.anthropic.com
      # Arricchimento statistiche (minutes/goals/assists) per il confronto ruoli
      # in asta. Off di default; nessuna funzionalità base ne dipende.
      - key: STATS_API_ENABLED
        value: false
      - key: STATS_API_KEY
        sync: false
      - key: STATS_API_BASE_URL
        value: https://v3.football.api-sports.io
      # Attributi EA FC (overall/potential/età/valore) via SoFIFA. Asse diverso,
      # non un rimpiazzo di API-Football. IMPORTANTE: api.sofifa.net NON è
      # pubblica, è whitelist-only: senza whitelist ogni chiamata è 403 (→ nessun
      # dato, nessuna regressione). Tenere OFF finché il caller non è whitelisted.
      # Gli attributi si mostrano solo per i giocatori con sofifa_id mappato
      # (script db:seed:sofifa, da lanciare in locale).
      - key: SOFIFA_ENABLED
        value: false
      - key: SOFIFA_BASE_URL
        value: https://api.sofifa.net
      # Riservato a un eventuale schema token di whitelist; non ancora inviato.
      - key: SOFIFA_API_TOKEN
        sync: false
