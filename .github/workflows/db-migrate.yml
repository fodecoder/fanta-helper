name: Neon DB Migration

"on":
  push:
    branches:
      - main

concurrency:
  group: neon-db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Apply Neon migrations
        run: npm run db:migrate --workspace server
        env:
          DATABASE_URL: ${{ secrets.NEON_DIRECT_DATABASE_URL }}
